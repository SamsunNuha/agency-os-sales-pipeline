version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agency_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agency_os_sales}
      POSTGRES_USER: ${POSTGRES_USER:-agency_os_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agency_os_user} -d ${POSTGRES_DB:-agency_os_sales}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agency_os_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme_in_env}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
